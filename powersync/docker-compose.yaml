# Self-hosted PowerSync (Open Edition) for local dev — see noote-plan.md §9
# and the "Online sync + Auth" plan's Phase E. Points at the *existing*
# local Supabase Postgres (started separately via `supabase start`) rather
# than running its own copy of the app database — only `pg-storage` here
# is PowerSync's own, for its internal bucket/checkpoint bookkeeping, kept
# separate from the app's data per PowerSync's reference self-host demo.
#
# Run from this directory: `docker compose up`.
services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    volumes:
      - ./config:/config
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      # powersync_role was created by supabase/migrations/ specifically
      # for this replication connection (replication + select-only).
      PS_DATA_SOURCE_URI: postgres://powersync_role:powersync_local_dev_password@host.docker.internal:54322/postgres
      PS_STORAGE_SOURCE_URI: postgres://postgres:postgres@pg-storage:5432/postgres
      # Local Supabase issues ES256-signed JWTs with a real JWKS endpoint
      # (confirmed against the running instance — not the older HS256
      # static-secret setup some self-host guides assume).
      PS_JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      PS_PORT: "8080"
      NODE_OPTIONS: --max-old-space-size=1000
    ports:
      - "8080:8080"
    depends_on:
      pg-storage:
        condition: service_healthy
    extra_hosts:
      # host.docker.internal works natively on Docker Desktop (macOS/
      # Windows); this line is what makes it resolve on Linux too.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  pg-storage:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pg_storage_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_storage_data:

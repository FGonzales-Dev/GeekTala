# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

telemetry:
  disable_telemetry_sharing: false

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # Fetches public keys from Supabase's own JWKS endpoint — matches this
  # project's local Supabase instance, which signs with ES256 (confirmed
  # against the running instance), not the older HS256 shared-secret setup.
  # (`supabase: true` also exists as a shortcut, but logged a "no Supabase
  # connection string found" warning here and offers nothing beyond this
  # explicit jwks_uri for a self-hosted setup.)
  jwks_uri: !env PS_JWKS_URL
  audience: ["authenticated"]

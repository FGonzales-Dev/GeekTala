# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Sync rules — noote-plan.md §6: scopes which rows sync to which user,
# based on owner_id (single-user ownership only for this pass; real
# sharing via folder_shares/note_shares is a later, separate build).
#
# The service needs a restart for changes here to take effect.
config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM notes WHERE owner_id = auth.user_id()
      - SELECT * FROM folders WHERE owner_id = auth.user_id()
      - SELECT * FROM tags WHERE owner_id = auth.user_id()
      - SELECT * FROM notes_tags WHERE owner_id = auth.user_id()
